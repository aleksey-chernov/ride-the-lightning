# Fly.io app. Deploy: sbt docker/Docker/stage, then
#   fly deploy target/out/jvm/scala-3.9.0/docker/docker/stage --config fly.toml --ha=false
# Login comes from secrets: fly secrets set BASIC_AUTH_USER=... BASIC_AUTH_PASSWORD=...
app = "ride-the-lightning"
primary_region = "ams"

[env]
  INGEST_SOURCE = "blitzortung"
  # public URL: refuse to start without the login secrets
  REQUIRE_BASIC_AUTH = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # one machine, always on: ingest must keep running, and a second one would open a second Blitzortung connection
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # the first start downloads the place shapes before the server listens
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
