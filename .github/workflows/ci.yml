name: CI

on:
  push:
    branches: [main]
  pull_request:

# one run per branch at a time, so two pushes can't deploy over each other
concurrency:
  group: ci-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # installs Java, sbt, Node and pnpm from .mise.toml
      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/sbt
            ~/.sbt
          key: sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}

      # Natural Earth shapes used by PlaceIndexTest; the pinned URLs live in NaturalEarth.scala
      - uses: actions/cache@v4
        with:
          path: data/geo
          key: geo-${{ hashFiles('backend/src/main/scala/rtl/geo/NaturalEarth.scala') }}

      - name: Backend tests
        run: sbt testFull

      - name: UI checks
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm test

      # builds the UI and the image locally; also stages the Docker build context used below
      - name: Docker image
        run: sbt docker/Docker/publishLocal

      # --local-only: build with the runner's Docker (layers cached from the step above) and push to Fly's registry;
      # --ha=false keeps one machine (one Blitzortung connection)
      - name: Deploy to Fly.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: fly deploy target/out/jvm/scala-3.9.0/docker/docker/stage --config "$PWD/fly.toml" --ha=false --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
