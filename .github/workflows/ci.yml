name: CI

on:
  push:
    branches: [main]
  pull_request:

# one run per branch at a time, so two pushes can't deploy over each other
concurrency:
  group: ci-${{ github.ref }}

env:
  IMAGE: registry.fly.io/ride-the-lightning:${{ github.sha }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # installs the tools pinned in .mise.toml (only those this job needs)
      - uses: jdx/mise-action@v5
        with:
          install_args: java sbt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/sbt
            ~/.sbt
          key: sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
      # Natural Earth shapes used by PlaceIndexTest; the pinned URLs live in NaturalEarth.scala
      - uses: actions/cache@v6
        with:
          path: data/geo
          key: geo-${{ hashFiles('backend/src/main/scala/rtl/geo/NaturalEarth.scala') }}
      - run: sbt testFull
      # ScalaTest results (sbt's JUnit XML) as a table in the run summary, like Vitest's for the UI; also after failures
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: target/out/jvm/scala-3.9.0/backend/test-reports/TEST-*.xml
          check_name: ScalaTest report
          detailed_summary: true
          annotate_only: true

  ui:
    name: UI checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  image:
    name: Docker image
    needs: [backend, ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: java sbt node pnpm flyctl
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/sbt
            ~/.sbt
          key: sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
      # builds the UI and the image ride-the-lightning:latest with the runner's Docker
      - run: sbt docker/Docker/publishLocal
      # on main, the deploy job below deploys exactly this image
      - name: Push to Fly's registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          fly auth docker
          docker tag ride-the-lightning:latest "$IMAGE"
          docker push "$IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    name: Deploy to Fly.io
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: flyctl
      # no build: the image job pushed it; --ha=false keeps one machine (one Blitzortung connection)
      - run: fly deploy --image "$IMAGE" --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
