http {
  host = "localhost"
  host = ${?HTTP_HOST}
  port = 8080
  port = ${?HTTP_PORT}
}

ingest {
  # blitzortung (live) | replay (recorded file)
  source = "blitzortung"
  source = ${?INGEST_SOURCE}

  blitzortung {
    servers = ["ws1.blitzortung.org", "ws2.blitzortung.org", "ws7.blitzortung.org", "ws8.blitzortung.org"]
  }

  replay {
    file = "data/sample.jsonl"
    file = ${?REPLAY_FILE}
    speed = 1.0
    speed = ${?REPLAY_SPEED}
  }
}

strikes {
  # in-memory history used by /strikes/recent and /stats
  window = 60 minutes
}
