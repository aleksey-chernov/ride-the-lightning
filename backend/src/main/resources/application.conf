http {
  host = "localhost"
  host = ${?HTTP_HOST}
  port = 8080
  port = ${?HTTP_PORT}
  # basic auth for everything except /api/v1/health; off while both are empty
  auth {
    user = ""
    user = ${?BASIC_AUTH_USER}
    password = ""
    password = ${?BASIC_AUTH_PASSWORD}
    # true on public hosts: refuse to start without credentials
    required = false
    required = ${?REQUIRE_BASIC_AUTH}
  }
}

ingest {
  # blitzortung (live) | replay (recorded file)
  source = "blitzortung"
  source = ${?INGEST_SOURCE}

  blitzortung {
    servers = ["ws1.blitzortung.org", "ws2.blitzortung.org", "ws7.blitzortung.org", "ws8.blitzortung.org"]
  }

  replay {
    file = "data/sample.jsonl"
    file = ${?REPLAY_FILE}
    speed = 1.0
    speed = ${?REPLAY_SPEED}
  }
}

strikes {
  # in-memory history used by /strikes/recent and /stats
  window = 60 minutes
}

geo {
  # Natural Earth shapes are downloaded here on the first start
  cache-dir = "data/geo"
  cache-dir = ${?GEO_CACHE_DIR}
}

history {
  # store live strikes in a SQLite file for playback and the window refill on restart; replay mode only reads it
  enabled = true
  enabled = ${?HISTORY_ENABLED}
  file = "data/history.db"
  file = ${?HISTORY_FILE}
  # stored strikes older than this are deleted every hour
  keep = 7 days
  # max strikes per /history/strikes response; longer ranges return every n-th strike
  max-strikes = 100000
}
